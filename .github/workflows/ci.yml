name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for version calculation
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          pdf21png/build
          pdf22png/.build
        key: ${{ runner.os }}-build-${{ hashFiles('**/Makefile', '**/Package.swift', '**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-build-
    
    - name: Check dependencies
      run: |
        make check-deps
    
    - name: Generate version files
      run: |
        make generate-version
    
    - name: Build projects
      run: |
        make all
    
    - name: Run tests
      run: |
        ./scripts/test-all.sh --verbose
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: test_output/
        retention-days: 7
    
    - name: Check for memory leaks
      if: runner.os == 'macOS'
      run: |
        if [[ -f "scripts/check-memory-leaks.sh" ]]; then
          ./scripts/check-memory-leaks.sh
        fi
    
    - name: Run performance benchmarks
      run: |
        if [[ -f "bench.sh" ]]; then
          ./bench.sh
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts-${{ github.sha }}
        path: |
          pdf21png/build/pdf21png
          pdf22png/.build/apple/Products/Release/pdf22png
        retention-days: 30